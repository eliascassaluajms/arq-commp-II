# ====================================================================
# Configuración NGINX para Arquitectura de Computadores II (DIC122)
# Dominio: arq2-cassal-labs.duckdns.org
# Proxy hacia Contenedor Docker: 127.0.0.1:4174
# ====================================================================

# Redirección de HTTP a HTTPS
server {
    server_name arq2-cassal-labs.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_log /var/log/nginx/arq2-lab-error.log;
    access_log /var/log/nginx/arq2-lab-access.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arq2-cassal-labs.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arq2-cassal-labs.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = arq2-cassal-labs.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name arq2-cassal-labs.duckdns.org;
    return 404; # managed by Certbot


}