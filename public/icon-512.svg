<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#151e2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(0, 204, 255, 0.3)" stroke-width="4"/>

  <!-- Circuit bus tracks -->
  <g stroke="rgba(0, 204, 255, 0.25)" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="120" x2="150" y2="120"/>
    <line x1="60" y1="180" x2="150" y2="180"/>
    <line x1="60" y1="330" x2="150" y2="330"/>
    <line x1="60" y1="390" x2="150" y2="390"/>
    
    <line x1="362" y1="120" x2="452" y2="120"/>
    <line x1="362" y1="180" x2="452" y2="180"/>
    <line x1="362" y1="330" x2="452" y2="330"/>
    <line x1="362" y1="390" x2="452" y2="390"/>

    <line x1="120" y1="60" x2="120" y2="150"/>
    <line x1="180" y1="60" x2="180" y2="150"/>
    <line x1="330" y1="60" x2="330" y2="150"/>
    <line x1="390" y1="60" x2="390" y2="150"/>

    <line x1="120" y1="362" x2="120" y2="452"/>
    <line x1="180" y1="362" x2="180" y2="452"/>
    <line x1="330" y1="362" x2="330" y2="452"/>
    <line x1="390" y1="362" x2="390" y2="452"/>
  </g>

  <!-- Central Processor Die -->
  <rect x="150" y="150" width="212" height="212" rx="24" fill="#0d1527" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- 4 Processor Cores inside Die -->
  <!-- Core 0 -->
  <rect x="175" y="175" width="72" height="72" rx="10" fill="rgba(0, 204, 255, 0.15)" stroke="#00ccff" stroke-width="2"/>
  <text x="211" y="218" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00ccff" text-anchor="middle">C0</text>

  <!-- Core 1 -->
  <rect x="265" y="175" width="72" height="72" rx="10" fill="rgba(0, 204, 255, 0.15)" stroke="#00ccff" stroke-width="2"/>
  <text x="301" y="218" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00ccff" text-anchor="middle">C1</text>

  <!-- Core 2 -->
  <rect x="175" y="265" width="72" height="72" rx="10" fill="rgba(0, 204, 255, 0.15)" stroke="#00ccff" stroke-width="2"/>
  <text x="211" y="308" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00ccff" text-anchor="middle">C2</text>

  <!-- Core 3 -->
  <rect x="265" y="265" width="72" height="72" rx="10" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="2"/>
  <text x="301" y="308" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b" text-anchor="middle">C3</text>

  <!-- Interconnect Crossbar In Center -->
  <circle cx="256" cy="256" r="14" fill="#080d1a" stroke="url(#amberGrad)" stroke-width="3"/>
  <circle cx="256" cy="256" r="4" fill="#00ccff"/>

  <!-- Banner text below -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">ARQ COMP II</text>
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#00ccff" text-anchor="middle">UAJMS • FBC</text>
</svg>
